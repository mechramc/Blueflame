# ═══════════════════════════════════════════════════════════════
# S12: ACAR σ-ROUTING (Enterprise Stream 2)
# Goal: Make the spec's core differentiator real — σ-informed
# model selection with self-consistency sampling and benchmarking.
# ═══════════════════════════════════════════════════════════════

  - id: S12-001
    system: S12-acar
    title: "Implement σ-based model routing in orchestrator"
    sprint: W6
    priority: P0
    description: |
      Replace hardcoded "gpt-4o" in orchestrator.ts with σ-informed routing.
      Route based on task.sigmaEstimate: σ < 0.3 → gpt-4o-mini (routine),
      0.3–0.7 → gpt-4o (standard), > 0.7 → o1 (complex). Record actual
      model used in agent state. Requires 3 model deployments in Azure OpenAI.
    spec_sections: [3, 6]
    files_to_create:
      - packages/foundry/src/routing/sigma-router.ts
      - packages/foundry/src/routing/model-registry.ts
    files_to_modify:
      - apps/api/src/services/orchestrator.ts
      - packages/foundry/src/config.ts
    dependencies: [S7-004]
    acceptance_criteria:
      - "Orchestrator selects model based on sigmaEstimate threshold"
      - "Low-σ tasks (< 0.3) route to gpt-4o-mini"
      - "Medium-σ tasks (0.3–0.7) route to gpt-4o"
      - "High-σ tasks (> 0.7) route to o1"
      - "Actual model recorded in AgentState.model field"
      - "Unit tests verify routing logic for all 3 tiers"
    verify_command: "npm run test -- --grep sigma-router"

  - id: S12-002
    system: S12-acar
    title: "Implement self-consistency sampling for high-σ tasks"
    sprint: W6
    priority: P1
    description: |
      For tasks with σ > 0.7, run N=3 parallel completions and compute
      variance. If variance exceeds threshold, escalate to multi-model
      ensemble (gpt-4o + o1 + claude-sonnet). Use majority vote for
      code generation, union for test generation.
    spec_sections: [3, 6.4]
    files_to_create:
      - packages/foundry/src/routing/self-consistency.ts
      - packages/foundry/src/routing/ensemble.ts
    dependencies: [S12-001]
    acceptance_criteria:
      - "N=3 parallel completions generated for high-σ tasks"
      - "Variance computed across completions"
      - "High-variance tasks escalate to multi-model ensemble"
      - "Ensemble uses majority vote for code, union for tests"
      - "Cost of sampling tracked and included in budget"
    verify_command: "npm run test -- --grep self-consistency"

  - id: S12-003
    system: S12-acar
    title: "Implement cost tracking per model tier and benchmarking"
    sprint: W6
    priority: P1
    description: |
      Track actual cost per model tier (mini vs standard vs premium).
